out_dir: "./output_psf" # Directory to save results
pixel_size: 0.1 # Pixel size in mm
circle_diameter: 100 # Diameter of the circle in mm
no_hough: false # Whether to skip Hough transform
n_angles: 360 # Number of projection angles
profile_half_length: 50 # Half-length of the profile in pixels
derivative_step: 1 # Step size for derivative calculation
axis_shifts: 10 # Number of axis shifts to produce
manual_shift: null # Manual shift to apply to the sinogram (if null, no shift or auto-shift is applied)
filter_name: "ramp" # Filter name for reconstruction (ram, shepp-logan, cosine, hamming, hann, none)
symmetrize: false # Whether to symmetrize the sinogram
auto_shift: true # Whether to automatically shift the sinogram
avg_neighbors: false # Whether to average neighboring pixels
avg_number: 3 # Number of neighboring pixels to average
oversample: true # Whether to oversample the PSF
dtheta: 2 # Angular step for oversampling in degrees
resample2: 4 # Radial resampling factor for the final (coarse) grid
gaussian_sigma: 0.0 # Sigma for Gaussian smoothing. Set to 0 for binned statistics (no blur), >0 for 3-step with Gaussian blur
show_plots: false # Whether to display plots

hough_params: # Hough transform parameters (typically do not need to be changed)
  dp: 1.3 # Inverse ratio of resolution
  min_dist: 100 # Minimum distance between detected centers
  param1: 70 # Upper threshold for Canny edge detector
  param2: 40 # Threshold for center detection
  min_radius: 100 # Minimum circle radius
  max_radius: 0 # Maximum circle radius (0 to use no maximum)
  debug: false # Whether to show hough transform debug plots

