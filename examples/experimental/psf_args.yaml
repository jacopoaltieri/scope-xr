# ==============================================================================
# 1. MAIN PARAMETERS & OVERSAMPLING (PSF Tab)
# ------------------------------------------------------------------------------
# Modify these parameters for every new experiment or setup.
# ==============================================================================

out_dir: "./output_psf"          # Directory to save results [--o]
pixel_size: 0.05                # Pixel size in mm [--p]
circle_diameter: 100            # Diameter of the circle object in mm [--d]
no_hough: false                 # Skip Hough transform completely (checkbox) [--no_hough]
filter_name: "ramp"             # Filter for reconstruction (ramp, shepp-logan, cosine, hamming, hann, None) [--filter]

# --- Oversampling Settings (Sub-Group on Main Tab) ---
oversample: true                # Enable oversampling for the PSF projection calculation
dtheta: 2                       # Angular step for oversampling in degrees [--dtheta]
oversampling_factor: 4          # Radial resampling factor for the final coarse grid [--resample2]


# ==============================================================================
# 2. ADVANCED ALGORITHM TUNING (Advanced Tab)
# ------------------------------------------------------------------------------
# These fine-tune the mathematical execution. Leave as default unless the standard 
# analysis is giving incorrect results or needs tweaking.
# ==============================================================================

n_angles: 360                   # Number of projection angles [--nangles]
profile_half_length: 50         # Half-length of the profile in pixels [--hl]
derivative_step: 1              # Step size for derivative calculation [--ds]
axis_shifts: 10                 # Shifts Search Range for alignment [--axis_shifts]
symmetrize: false               # Whether to symmetrize the sinogram [--sym]
gaussian_sigma: 0.0             # Sigma for Gaussian blur. (0 = binned stats, >0 = 3-step calculation) [--gaussian_sigma]
show_plots: false               # Whether to display Matplotlib window plots [--show]

# --- Sinogram Shifting Modes ---
# Determines how the sinogram center is calibrated (Matches GUI radio buttons)
auto_shift: true                # Automatically calculate and shift the sinogram center [--auto_shift]
no_shift: false                 # Disable center sinogram shifting [--no_shift]
manual_shift: null              # Apply an explicit pixel shift (Overridden if null) [--manual_shift]


# ==============================================================================
# 3. HOUGH CIRCLE DETECTION PARAMETERS (Advanced Tab -> Sub-Group)
# ------------------------------------------------------------------------------
# Highly technical parameters for the computer vision circle finder. 
# DO NOT TOUCH unless the program fails to locate the object boundary.
# ==============================================================================

hough_params:
  dp: 1.3                       # Inverse ratio of the accumulator resolution
  min_dist: 100                 # Minimum distance (in pixels) between detected centers
  param1: 70                    # Upper threshold passed to the Canny edge detector
  param2: 40                    # Accumulator threshold for center detection
  min_radius: 100               # Minimum circle radius to search for (in pixels)
  max_radius: 0                 # Maximum circle radius to search for (in pixels, 0 for no max)
  debug: false                  # Show intermediate Hough tracking diagnostic plots