name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push version bumps, changelogs, and tags
      id-token: write # Required for secure PyPI Trusted Publishing

    steps:
      # 1. Checkout the repository with full git history
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python environment (Matches your test.yaml python version)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install test and build dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build  # Ensures python-semantic-release can build your project
          pip install ".[test]" # Installs package test dependencies from your pyproject.toml

      # 4. Run your test suite (If this fails, the workflow stops right here)
      - name: Run Tests
        run: |
          pytest -q
        env:
          CI: true

      # 5. Perform the release (Only runs if steps 1-4 pass successfully)
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}