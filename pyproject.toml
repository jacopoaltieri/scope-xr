[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scopexr"
version = "1.2.1"
description = "Single-image Characterization Of PErformance in X-Ray systems"
authors = [
  { name = "Jacopo Altieri", email = "jacopo.altieri@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "PyQt6",
    "PyYAML",
    "scikit-image",
    "opencv-python",
    "pydicom"
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

test = [
    "pytest",
    "pytest-cov",
]

dev = [
    "ruff"
]

all = [
    "scopexr[docs,test,dev]"
]

[project.scripts]
scopexr-gui = "scopexr.gui:main"
scopexr-fs = "scopexr.fs_main:main"
scopexr-psf = "scopexr.psf_main:main"

[tool.setuptools.package-data]
scopexr = ["*.png"]